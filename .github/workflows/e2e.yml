name: E2E pyperf-suite

on:
  push:
    branches: [main]
    paths:
      - "examples/pyperf-suite/**"
      - "scripts/execute_markdown.py"
      - "requirements-e2e.txt"
      - ".github/workflows/e2e-pyperf.yml"

  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pyperf-suite:
    name: pyperf-suite (PyPI BenchX)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out benchx_examples
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-e2e.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-e2e.txt

      - name: Show environment
        run: |
          python --version
          python -m pip show benchx pyperf
          git rev-parse HEAD

      - name: Execute pyperf-suite README
        run: |
          python scripts/execute_markdown.py \
            --source examples/pyperf-suite/README.md \
            --output generated/pyperf-suite/README.md \
            --logs logs/pyperf-suite

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-pyperf-suite
          path: logs/pyperf-suite/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload generated documentation
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: docs-pyperf-suite
          path: generated/pyperf-suite/
          if-no-files-found: error
          retention-days: 14

