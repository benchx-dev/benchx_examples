name: E2E

# One job per example, each calling the reusable workflow. The `paths` filter below applies
# to the whole workflow, so extend it when an example is added.
on:
  push:
    branches: [main]
    paths:
      - "examples/pyperf-suite/**"
      - "scripts/execute_markdown.py"
      - ".github/workflows/e2e.yml"
      - ".github/workflows/reusable-example.yml"

  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pyperf-suite:
    uses: ./.github/workflows/reusable-example.yml
    with:
      example: pyperf-suite
      benchx-source: pypi
      examples-repository: ${{ github.repository }}
      examples-ref: ${{ github.sha }}
